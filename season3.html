    .shell { min-height: 100vh; display: flex; flex-direction: column; }

    .tag { margin: 8px 0 0; color: #8a671e; font-size: 13px; }
    .level-select { display: grid; place-items: start center; padding: 8px 16px 28px; }
    .level-select-card { width: min(720px, 100%); padding: 22px 18px 18px; background: rgba(255, 250, 220, .96); border: 2px solid #e3a823; border-radius: 12px; box-shadow: 0 16px 50px rgba(148, 96, 15, .22); }

    .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
    .level-cell { position: relative; min-height: 72px; border-radius: 10px; border: 2px solid #c79d48; background: linear-gradient(180deg, #f5db93, #e7c774); color: #765415; font: 700 18px "Noto Sans SC", sans-serif; padding: 12px 6px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: not-allowed; }
    .level-cell.playable { text-decoration: none; border-color: #df8d00; background: linear-gradient(180deg, #ffe982, #ffc53b); color: #6b4000; box-shadow: 0 3px 0 #c7891c; cursor: pointer; }
    .level-cell.playable:hover { filter: brightness(1.05); }
    .level-cell.playable:focus-visible { outline: 3px solid #9a5c00; outline-offset: 3px; }
    .badge { font-size: 10px; color: #765415; background: rgba(255, 255, 255, .45); border-radius: 999px; padding: 2px 8px; }
    .footer-links { display: flex; gap: 10px; margin-top: 18px; }
    .side-btn { flex: 1; display: block; border: 1px solid #c79837; border-radius: 10px; padding: 12px; background: #fff1be; color: #79500b; text-align: center; text-decoration: none; font-size: 14px; font-weight: 700; }
    .side-btn:hover { background: #ffe394; }
    .side-btn:focus-visible { outline: 3px solid #9a5c00; outline-offset: 3px; }
    @media (max-width: 380px) { .level-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; } .level-select-card { padding: 18px 12px; } }
