<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务器开关</title>
  <meta name="theme-color" content="#101816">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark" aria-hidden="true">◈</span> SERVER CONTROL</div>
    <section id="login-panel" class="card" aria-labelledby="login-title">
      <div class="eyebrow">访问验证</div>
      <h1 id="login-title">先登录，再控制。</h1>
      <p class="description">输入姓名和密码，开启你的服务器。</p>
      <form id="login-form">
        <label for="name">姓名</label>
        <input id="name" name="name" autocomplete="username" placeholder="请输入姓名" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        <p id="login-error" class="error" role="alert"></p>
        <button id="login-button" type="submit">登录</button>
      </form>
    </section>
    <section id="control-panel" class="card control-card" hidden aria-label="服务器控制">
      <div class="eyebrow">游戏服务器</div>
      <p id="server-status" class="status" role="status" aria-live="polite">正在检查</p>
      <button id="server-switch" class="power-button" type="button" disabled aria-describedby="switch-hint">
        <svg aria-hidden="true" viewBox="0 0 48 48"><path d="M24 5v20M13 11a18 18 0 1 0 22 0"/></svg>
        <span>服务器开关</span>
      </button>
      <div id="operation-progress" class="operation-progress" hidden>
        <progress id="server-progress" value="0" max="100" aria-label="服务器操作进度"></progress>
        <div class="operation-caption"><span id="operation-message" role="status" aria-live="polite">启动中…</span><span id="operation-percent" aria-hidden="true">0%</span></div>
      </div>
      <p id="switch-hint" class="description">点击开启服务器</p>
      <div class="connections"><span>本机 · 8080</span><span id="lan-label">局域网 · 192</span></div>
      <p id="control-error" class="error" role="alert"></p>
    </section>
    <p class="footer">一个开关，同时控制电脑与局域网游戏入口。</p>
  </main>
</body>
</html>
