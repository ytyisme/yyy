<!-- Installable game application -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#152d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="岩浆跑酷">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="app-icons/icon-180.png">
<link rel="icon" type="image/png" href="app-icons/icon-192.png">
<link rel="stylesheet" href="pwa.css">

<body data-no-theme-music>
  <main>
    <header>
      <a class="back" href="season3.html">← 第三季主页</a>
      <h1>第三季 · 第2关</h1>
      <span id="network" role="status">公共大厅连接中…</span>
    </header>
    <p class="hint">出生在巨大的充气城堡里，直接和其他玩家联机。避开黄金巨猛（屎）和黑曼巴（屎），手动玩设施，找准三个小孩让开的时机冲进主塔并爬到塔顶。</p>
    <div class="game-frame">
      <section class="castle-card" aria-label="3D充气城堡大闯关">
        <canvas id="castle" width="1200" height="700" aria-label="3D充气城堡游戏场景"></canvas>
        <div class="hud"><span id="status">WASD 移动 · 拖动画面转视角</span><span id="players">玩家 1</span></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="touch-controls" aria-label="移动控制">
          <button data-key="forward" type="button">↑</button>
          <div><button data-key="left" type="button">←</button><button data-key="back" type="button">↓</button><button data-key="right" type="button">→</button></div>
        </div>
        <button class="interact" id="interact" type="button">E 交互</button>
      </section>
    </div>
    <p class="guide">WASD / 方向键移动，拖动画面旋转视角，E 开始设施或主塔攀爬，Space 在蹦床上手动起跳。攀爬架、滑梯、蹦床和主塔都不会自动完成。</p>
  </main>
  <script src="lib/vendor/three.min.js"></script>
  <script type="module" src="season3-lv2.js?v=castle1"></script>
</body>
</html>
