<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第二季 · 第9关 · 脑筋急转弯</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0a1a3a; color: #e8f4ff; font-family: system-ui, sans-serif; }
    main { max-width: 760px; margin: auto; padding: 24px 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: clamp(20px, 4vw, 28px); color: #7ec8ff; }
    a { color: #cfeaff; }
    .card { margin-top: 30px; padding: clamp(20px, 5vw, 40px); border: 2px solid #3d7eb8; border-radius: 20px; background: #102b50; }
    #progress, .hint { color: #9bbfe0; line-height: 1.7; }
    h2 { min-height: 3em; font-size: clamp(22px, 5vw, 32px); line-height: 1.6; overflow-wrap: anywhere; }
    label { display: flex; align-items: center; gap: 10px; font-size: 20px; }
    input { width: 100%; min-width: 0; padding: 14px; border-radius: 10px; border: 2px solid #639ad0; background: #071b34; color: #fff; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid #ffd24a; outline-offset: 3px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    button { cursor: pointer; padding: 13px 18px; border-radius: 10px; border: 1px solid #609cd5; background: #224e82; color: #fff; font: inherit; }
    .primary { background: #ffd24a; color: #302400; border-color: #ffd24a; }
    button:disabled { opacity: .45; cursor: default; }
    #status { min-height: 3em; line-height: 1.6; color: #ffd875; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header><h1>第二季 · 第 9 关 · 脑筋急转弯</h1><a href="season2.html">← 第二季首页</a></header>
    <p class="hint">答案可能不止一个，填入任意一个正确答案即可！不会可以跳过，也可以点“答案”查看。全部题目提交正确答案后过关。</p>
    <section class="card" aria-label="脑筋急转弯答题">
      <p id="progress"></p>
      <h2 id="question"></h2>
      <form id="answer-form">
        <label for="answer"><span style="white-space:nowrap">答案：</span><input id="answer" autocomplete="off" maxlength="120"></label>
        <div class="actions">
          <button class="primary" id="submit" type="submit">提交答案</button>
          <button id="skip" type="button">我不会，跳过</button>
          <button id="reveal" type="button">答案</button>
          <button id="next" type="button" hidden>下一题</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="season2-lv9.js?v=multiple-answers"></script>
</body>
</html>
