<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第二季 · 第10关 · 我说一句，你接一句</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0a1a3a; color: #e8f4ff; font-family: system-ui, sans-serif; }
    main { max-width: 760px; margin: auto; padding: 24px 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); color: #7ec8ff; }
    a { color: #cfeaff; }
    .hint, #progress { color: #9bbfe0; line-height: 1.7; }
    .card { margin-top: 24px; padding: clamp(18px, 4vw, 32px); border: 2px solid #3d7eb8; border-radius: 20px; background: #102b50; }
    #conversation { display: flex; flex-direction: column; gap: 16px; margin: 24px 0; }
    .message { max-width: 90%; padding: 14px 18px; border-radius: 16px; overflow-wrap: anywhere; }
    .system { align-self: flex-start; background: #1d4775; border-bottom-left-radius: 4px; }
    .player { align-self: flex-end; background: #2c635e; border-bottom-right-radius: 4px; }
    .speaker { display: block; margin-bottom: 6px; font-size: 12px; color: #c5e3fa; }
    .line { margin: 0; font-size: clamp(20px, 4vw, 26px); line-height: 1.6; }
    label { display: block; margin-bottom: 10px; }
    .reply { display: flex; gap: 10px; }
    input { flex: 1; width: 100%; min-width: 0; padding: 14px; border-radius: 10px; border: 2px solid #639ad0; background: #071b34; color: #fff; font: inherit; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #ffd24a; outline-offset: 3px; }
    button { cursor: pointer; padding: 13px 18px; border-radius: 10px; border: 1px solid #ffd24a; background: #ffd24a; color: #302400; font: inherit; white-space: nowrap; }
    #status { min-height: 3em; line-height: 1.6; color: #ffd875; }
    #complete { text-align: center; padding: 16px 0; }
    #complete h2 { color: #ffd24a; font-size: 30px; }
    #complete p { line-height: 1.8; }
    .actions { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 24px; }
    [hidden] { display: none !important; }
    @media (max-width: 400px) { .reply { flex-direction: column; } .message { max-width: 100%; } }
  </style>

<!-- Installable game application -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#152d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="岩浆跑酷">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="app-icons/icon-180.png">
<link rel="icon" type="image/png" href="app-icons/icon-192.png">
<link rel="stylesheet" href="pwa.css">
<script defer src="pwa.js"></script>
</head>
<body>
  <main>
    <header><h1>第 10 关 · 我说一句，你接一句</h1><a href="season2.html">← 第二季首页</a></header>
    <p class="hint">系统说上半句，你接下半句。五句全部接对，就能过关！</p>
    <section class="card" aria-label="接句挑战">
      <p id="progress"></p>
      <div id="conversation" role="log" aria-label="接句对话" aria-live="polite"></div>
      <form id="reply-form">
        <label for="reply">你来接：</label>
        <div class="reply">
          <input id="reply" placeholder="输入下一句" autocomplete="off" maxlength="80" aria-describedby="status">
          <button type="submit">接一句</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="complete" hidden>
        <h2>恭喜过关！</h2>
        <p>五句全部接对了，默契满分！</p>
        <div class="actions"><button id="retry" type="button">再玩一次</button><a href="season2.html">回第二季首页</a></div>
      </div>
    </section>
  </main>
  <script src="season2-lv10.js?v=reply-five"></script>
</body>
</html>
