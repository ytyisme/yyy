<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#264f53">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="../app-icons/icon-192.png">
  <link rel="apple-touch-icon" href="../app-icons/icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="./login.css">
  <link rel="stylesheet" href="../login-agreement.css?v=265">
  <script defer src="../login-agreement.js?v=265"></script>
  <script defer src="./login.js"></script>
  <title>手机号登录 · 岩浆跑酷</title>
</head>
<body data-phone-mode="demo">
  <main class="phone-shell">
    <a class="phone-brand" href="./index.html"><img src="../app-icons/icon-192.png" alt="" width="42" height="42">岩浆跑酷</a>
    <section class="phone-card">
      <div class="phone-sky" aria-hidden="true"><span class="phone-star">★</span><span class="phone-cloud"></span><span class="phone-island"></span></div>
      <div class="phone-form-wrap">
        <p id="phone-mode" class="phone-tag">演示登录</p>
        <h1>手机号登录</h1>
        <p class="phone-intro">登录后，继续你的城市旅行和两季冒险。</p>
        <form id="phone-form" novalidate>
          <label for="phone">手机号</label>
          <div class="phone-number"><span>+86</span><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="11" placeholder="输入 11 位手机号" required></div>
          <label id="code-label" for="code">演示验证码</label>
          <div class="phone-code"><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" required><button id="send-code" type="button" disabled>获取验证码</button></div>
          <output id="demo-code" class="phone-demo-code" hidden aria-live="polite"></output>
          <p id="phone-status" role="status" aria-live="polite">点击获取验证码，演示码会直接显示在这里。</p>
          <div class="login-consent">
            <input id="login-agreement" type="checkbox" aria-describedby="agreement-error">
            <span><label for="login-agreement">我已阅读并同意 岩浆跑酷·全关联机 </label><button type="button" data-agreement-document="terms">用户协议</button>和<button type="button" data-agreement-document="privacy">隐私政策</button></span>
          </div>
          <p id="agreement-error" role="alert" hidden></p>
          <button id="phone-submit" class="phone-submit" type="submit" disabled>登录并开始游戏 →</button>
        </form>
        <p id="phone-private" class="phone-private">演示模式 · 不发送短信</p>
        <p id="phone-note" class="phone-note">演示码 5 分钟内有效，输入正确后即可试玩。</p>
        <noscript><p>请启用浏览器的 JavaScript 后登录。</p></noscript>
      </div>
    </section>
    <footer>手机 · 平板 · 电脑</footer>
  </main>
</body>
</html>
