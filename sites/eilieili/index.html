<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EiliEili · 发现你的精彩</title><meta name="description" content="EiliEili 是一个分享和观看视频的网站，发现生活、游戏、音乐、知识和动画的精彩内容。"><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><a class="brand" href="/"><img src="/logo.png" alt="EiliEili"><span>EiliEili</span></a><nav><a href="/">首页</a><a href="#discover">发现</a></nav><form id="search-form" class="search"><input id="search" placeholder="搜索视频、UP主" aria-label="搜索视频"><button aria-label="搜索">⌕</button></form><button id="upload-open" class="upload">＋ 投稿</button></header>
<main><section class="hero"><div><span class="eyebrow">HELLO, EILIEILI</span><h1>你喜欢的精彩，<br>都在这里。</h1><p>分享生活，发现热爱。每一个故事，都值得被看见。</p><button id="hero-upload">发布你的第一个视频 ↗</button></div><div class="hero-mark"><img src="/logo.png" alt=""></div></section>
<section id="discover" class="discover"><div class="section-head"><div><span class="eyebrow">EXPLORE VIDEOS</span><h2>发现好视频 <span>✦</span></h2></div><button id="refresh" class="refresh">↻ 刷新</button></div><div class="categories" id="categories"><button class="selected" data-category="全部">全部</button><button data-category="生活">生活</button><button data-category="游戏">游戏</button><button data-category="音乐">音乐</button><button data-category="知识">知识</button><button data-category="动画">动画</button><button data-category="其他">其他</button></div><p id="feed-status" class="feed-status" role="status">正在加载视频…</p><div id="videos" class="video-grid"></div></section></main>
<dialog id="upload-dialog"><form id="upload-form"><div class="dialog-head"><div><span class="eyebrow">CREATE SOMETHING</span><h2>发布视频</h2></div><button type="button" class="close" data-close="upload-dialog" aria-label="关闭">×</button></div><p class="muted">把你的精彩分享给 EiliEili 的朋友们</p><label class="file-picker">＋ 选择视频文件 <small>MP4 / WebM，最大 100 MB</small><input type="file" id="file" accept="video/mp4,video/webm" required></label><p id="file-name" class="muted"></p><label>视频标题<input id="title" maxlength="100" required placeholder="给视频起个名字"></label><div class="row"><label>你的昵称<input id="author" maxlength="40" required placeholder="怎么称呼你"></label><label>视频分类<select id="category"><option>生活</option><option>游戏</option><option>音乐</option><option>知识</option><option>动画</option><option>其他</option></select></label></div><label>简介<textarea id="description" maxlength="2000" placeholder="介绍一下你的视频吧"></textarea></label><p id="upload-status" role="status"></p><button class="submit" id="submit">发布视频</button></form></dialog>
<dialog id="player-dialog"><div class="dialog-head"><h2 id="player-title"></h2><button class="close" data-close="player-dialog" aria-label="关闭">×</button></div><video id="player" controls playsinline></video><div class="player-meta"><strong id="player-author"></strong><span id="player-category"></span></div><p id="player-description"></p></dialog><footer>© EiliEili · 分享你所热爱的</footer><script src="/app.js"></script></body></html>
