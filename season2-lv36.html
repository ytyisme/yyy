<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荒岛生存</title><link rel="stylesheet" href="season2-lv36.css?v=20261107f"></head><body><main><a href="season2.html">← 第二季主页</a><h1>🌴 荒岛生存</h1><p id="network">请输入名字后进入荒岛</p><form id="name-form"><label>你的名字 <input id="name" maxlength="12" required></label><button>进入荒岛</button></form><section id="play" hidden><div class="bar"><span id="stats"></span><button id="ride" hidden>骑上坐骑</button><button id="inventory-toggle">🎒 物品栏</button><button id="shop-toggle">🛒 商店</button></div><p>岛屿大小：100 × 100 米。走向海岸才能看到大海。点击出生地的船长与他对话；靠近树木或石块后长按采集，也可使用空格或采集按钮。</p><div class="scene"><canvas id="game" width="900" height="520" aria-label="100米乘100米的荒岛地图"></canvas><div id="dialogue" class="dialogue" hidden role="dialog" aria-label="船长的对话" tabindex="0"><div class="dialogue-box"><strong>船长说：</strong><p id="dialogue-text"></p><span>点击任意处继续</span></div></div></div><p id="hint" aria-live="polite"></p><div class="controls"><button data-move="left">←</button><button data-move="up">↑</button><button data-move="down">↓</button><button data-move="right">→</button><button id="mine">按住采集</button></div><section id="inventory" hidden><h2>🎒 物品栏</h2><p id="inventory-items"></p><p>砍树和挖石后会掉落钱，靠近即可拾取。</p></section><section class="chat" aria-label="荒岛聊天"><h2>荒岛聊天</h2><div id="chat-log" role="log" aria-live="polite"></div><form id="chat-form"><label for="chat-input">消息</label><input id="chat-input" maxlength="120" placeholder="和岛上的朋友聊聊天" autocomplete="off"><button id="chat-send">发送</button></form><p id="chat-status">连接成功后可以聊天。</p></section><section id="shop" hidden><h2>荒岛商店</h2><p>速度升级每级缩短20%采集时间，最低1秒；背包满时不能采集。石镐5秒挖石、斧头3秒砍树。工具买到后自动使用，坐骑可骑乘加快移动。货币和背包只在本局有效；每位玩家的树木和石块独立刷新。</p><button data-buy="speed">⚡ 升级速度</button><button data-buy="capacity">🎒 背包 +10（40元）</button><button data-buy="axe">🪓 斧头（35元）</button><button data-buy="pick">⛏ 石镐（30元）</button><button data-buy="mount">🐎 坐骑（100元）</button></section></section></main><script type="module" src="season2-lv36.js?v=20261107f"></script><script type="module">import {installThemeMusic} from "./lib/theme-music.mjs?v=20261107a";installThemeMusic();</script></body></html>
