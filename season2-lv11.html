<body>
  <main>
    <header><h1>第 11 关 · 成语接龙</h1><a href="season2.html">← 第二季首页</a></header>
    <p class="hint">每轮随机 5 题。用上句的最后一个字，接一个成语；必须是同一个字，五题全部接对后过关。</p>
    <section class="card" aria-label="成语接龙挑战">
      <p id="progress"></p>
      <div id="challenge">
        <div class="prompt">
          <p>系统出题</p><h2 id="idiom"></h2><p id="clue"></p>
        </div>
        <form id="reply-form">
          <label for="reply">你来接：</label>
          <div class="reply"><input id="reply" placeholder="输入一个成语" autocomplete="off" maxlength="40" aria-describedby="status clue"><button type="submit">接龙</button></div>
        </form>
        <div class="actions"><button id="hint" type="button" class="secondary">给个提示</button></div>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="complete" hidden>
        <h2>恭喜过关！</h2><p>五题全部接对，成语接龙挑战完成！</p>
        <div class="actions"><button id="retry" type="button">再随机一轮</button><a href="season2-lv12.html">下一关：电影院 →</a><a href="season2.html">回第二季首页</a></div>
      </div>
      <ol id="history" aria-label="本轮接龙记录"></ol>
    </section>
    <p class="source">本关收录<a href="https://wenku.baidu.com/tfview/5968022726c52cc58bd63186bceb19e8b8f6ec35" target="_blank" rel="noopener noreferrer">《成语接龙500条》</a>公开预览中的 104 个成语。请用收录的成语接龙，不会时可以查看提示。</p>
